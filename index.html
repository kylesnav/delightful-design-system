<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Delightful is a warm, neo-brutalist design system built on OKLCH colors, three-tier tokens, and springy motion.">
  <meta http-equiv="refresh" content="0; url=delightful-design-system.html">
  <link rel="canonical" href="https://delightful.build/delightful-design-system.html">
  <title>Delightful — Design System</title>
  <script>
    window.location.replace('delightful-design-system.html');
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: oklch(0.982 0.008 70);
      --text-primary: oklch(0.200 0.015 60);
      --accent-primary: oklch(0.640 0.270 350);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: oklch(0.140 0.014 65);
        --text-primary: oklch(0.935 0.008 70);
        --accent-primary: oklch(0.700 0.230 350);
      }
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg-page);
      color: var(--text-primary);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(32rem, calc(100% - 2rem));
      text-align: center;
    }

    a {
      color: var(--accent-primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p>Opening the <a href="delightful-design-system.html">Delightful Design System</a>.</p>
  </main>
</body>
</html>
